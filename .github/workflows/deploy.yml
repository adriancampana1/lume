name: Deploy

on:
  push:
    branches:
      - main
    # Ou mantenha as tags "v*.*.*" se preferir aprovação manual, 
    # mas o push do Docker precisa incluir a tag :latest

env:
  REGISTRY: ghcr.io
  # Adapte para o case-sensitive caso o docker reclame de repo com letra maiúscula
  API_IMAGE_NAME: ${{ github.repository }}/api
  WEB_IMAGE_NAME: ${{ github.repository }}/web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # O manual manda sobrescrever a :latest
          tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # O manual manda sobrescrever a :latest
          tags: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/services/lume/

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}        # Mudando para o nome do manual
          username: deploy                     # O usuário explicitado no manual
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/services/lume

            # Usar 'docker compose' (plugin) e não docker-compose legacy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Comando de faxina de disco (Capítulo 04)
            docker image prune -f