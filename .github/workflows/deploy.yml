  name: Deploy

  on:
    push:
      branches:
        - main

  env:
    REGISTRY: ghcr.io
    API_IMAGE_NAME: ${{ github.repository }}/api
    WEB_IMAGE_NAME: ${{ github.repository }}/web

  jobs:
    build-and-push:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

      steps:
        - uses: actions/checkout@v4

        - name: Log in to the Container registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push API Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: apps/api/Dockerfile
            push: true
            tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest

        - name: Build and push Web Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: apps/web/Dockerfile
            push: true
            tags: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest

    deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
        - name: Deploy via SSH
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.VPS_HOST }}
            username: deploy
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              # Navegar para o diretório do serviço
              cd /opt/services/lume

              # Baixar a imagem mais recente do ghcr.io
              docker compose pull

              # Recriar o container com a nova imagem (sem downtime perceptível)
              docker compose up -d

              # Remover imagens antigas sem tag para liberar espaço em disco
              docker image prune -f