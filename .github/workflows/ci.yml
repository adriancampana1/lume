name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lume
          POSTGRES_PASSWORD: lume
          POSTGRES_DB: lume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lume"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://lume:lume@localhost:5432/lume
      AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_URL: http://localhost:3001
      GOOGLE_CLIENT_ID: ci-test-id
      GOOGLE_CLIENT_SECRET: ci-test-secret
      TMP_DIR: /tmp/lume-ci
      ANTHROPIC_API_KEY: sk-ant-ci-test
      RESEND_API_KEY: re_ci_test
      EMAIL_FROM: ci@lume.invalid
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lume/pdf exec playwright install --with-deps chromium

      - run: pnpm --filter @lume/db db:migrate

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build