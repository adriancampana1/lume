services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lume
      POSTGRES_USER: lume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lume}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume -d lume"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lume:${POSTGRES_PASSWORD:-lume}@db:5432/lume
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}-web:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: https://lume.example.com
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data: