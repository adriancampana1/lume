services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lume
      POSTGRES_USER: lume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lume}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume -d lume"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
